name: e2e
on:
  push:
    branches: [feature/remote-control-total]
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run wasm 2>/dev/null || true
      - run: npx vite build
        env:
          VITE_REMOTE_TOKEN: secret123
      - run: npx tsx scripts/build-demo.ts
      - run: |
          REMOTE_TOKEN=secret123 PORT=8080 STATIC_DIR=./dist node scripts/remote-server.mjs &
          sleep 3
          npx playwright test tests/e2e/smoke.spec.ts
