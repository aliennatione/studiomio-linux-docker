name: DJ check
on:
  push:
    branches: [feature/dj-mode, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit --skipLibCheck --project tsconfig.ci.json
      - run: npx vitest run tests/dj.test.ts
      - run: npx vite build
        env:
          GITHUB_ACTIONS: 'true'
