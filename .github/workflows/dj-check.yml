name: DJ check
on:
  push:
    branches: [feature/dj-mode, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@wasm-pack
      - run: npm run wasm
      - run: npm run wasm:test
      - run: npx tsc --noEmit
      - run: npx vitest run tests/dj.test.ts
      - run: npx vite build
        env:
          GITHUB_ACTIONS: 'true'
